# ──────────────── kube-prometheus-stack Helm Values ────────────────
# Chart:   prometheus-community/kube-prometheus-stack
# Cluster: OKE Always Free — ARM64 A1.Flex, NFS storage, single node
# Scope:   Metrics + Alerting + Dashboards (Prometheus + Grafana + AlertManager)
# Access:  Cloudflare Tunnel + Cloudflare Access (grafana.kouni.io) + kubectl port-forward
#
# Design principles:
#   - All workloads pinned to ARM64 nodes (nodeSelector)
#   - All persistent data on in-cluster NFS StorageClass
#   - No LoadBalancer / Ingress — ClusterIP only; Cloudflare Tunnel for egress
#   - Single replica everywhere (Always Free = no HA budget)
#   - retentionSize stays 1 Gi below PVC size to prevent TSDB OOMKill

# ──────────────── Global ────────────────
commonLabels:
  alwaysfree: "true"

# ──────────────── Prometheus ────────────────
prometheus:
  prometheusSpec:
    replicas: 1

    # Retention: 90 days by time; 4.5 GB by size (PVC is 5 Gi — 0.5 Gi buffer).
    # Sizing basis: ~5050 active series (OCI infra only) × 30s interval × 1.5 B/sample
    # ≈ 253 B/s → ~1.97 GB at 90d. retentionSize triggers auto-eviction before PVC fills.
    retention: 90d
    retentionSize: 4.5GB

    # WAL compression reduces write-ahead log size by ~20 % at negligible CPU cost.
    walCompression: true

    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1.5Gi

    # ARM64 nodes only
    nodeSelector:
      kubernetes.io/arch: arm64

    # NFS-backed TSDB; StatefulSet volumeClaimTemplate — PVC is retained on helm uninstall
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

# ──────────────── Grafana ────────────────
grafana:
  enabled: true

  # Steady-state working set is ~310–490 Mi; bursts from public scanners pushed it
  # past the previous 768 Mi limit and triggered a SIGKILL (exit 137).
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  nodeSelector:
    kubernetes.io/arch: arm64

  # NFS-backed dashboards / user data.
  # Grafana uses a Deployment (not a StatefulSet): helm uninstall will delete its PVC
  # unless the keep annotation is present. This prevents accidental data loss when
  # re-installing or rolling back the chart.
  persistence:
    enabled: true
    storageClassName: nfs
    size: 2Gi
    annotations:
      "helm.sh/resource-policy": keep

  grafana.ini:
    server:
      # Cloudflare Tunnel public URL — must match the tunnel ingress hostname
      root_url: https://grafana.kouni.io
    security:
      # Mark session cookies as Secure since external traffic arrives over HTTPS
      cookie_secure: true
    auth:
      # Cloudflare Access (Google IdP) is the only sign-in method. Built-in
      # username/password login (form and POST /login API) is disabled because
      # Grafana is reachable from the public internet through the Cloudflare Tunnel.
      disable_login: true
      disable_login_form: true
    auth.basic:
      # Reject HTTP Basic auth on the API so the admin password cannot be
      # used remotely even if it leaks.
      enabled: false
    auth.jwt:
      # Cloudflare Access authenticates the user once (Google IdP) and attaches
      # a signed JWT to every request it forwards through the tunnel. Grafana
      # verifies the signature against the team JWKS and pins aud/iss to the
      # grafana.kouni.io Access application, so tokens from other Access apps
      # or forged headers are rejected.
      enabled: true
      header_name: Cf-Access-Jwt-Assertion
      email_claim: email
      username_claim: email
      jwk_set_url: https://kouni.cloudflareaccess.com/cdn-cgi/access/certs
      cache_ttl: 60m
      expect_claims: '{"aud": ["07bcfa0b127a54b703c54df59dc5e39af84bdc9a3090b9e3f6b4fb96ea4429f2"], "iss": "https://kouni.cloudflareaccess.com"}'
      auto_sign_up: true
      # Role is re-evaluated on every request. Listed accounts become Grafana
      # server admins (password login is disabled, so this is the only admin
      # path); every other account allowed by the Access policy is Viewer.
      role_attribute_path: "contains(['kouni@lcse.org'], email) && 'GrafanaAdmin' || 'Viewer'"
      allow_assign_grafana_admin: true
    auth.google:
      # Disabled: Cloudflare Access already authenticates with Google, and a
      # second Grafana-side OAuth flow forced another consent prompt.
      # Kept configured so it can be re-enabled if Access is removed.
      enabled: false
      # Credentials are injected from the grafana-google-oauth Kubernetes Secret
      # (see k8s/monitoring/secret-grafana-google-oauth.yaml.example).
      client_id: ${GF_AUTH_GOOGLE_CLIENT_ID}
      client_secret: ${GF_AUTH_GOOGLE_CLIENT_SECRET}
      scopes: openid email profile
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      api_url: https://openidconnect.googleapis.com/v1/userinfo
      # Restrict sign-in to @lcse.org Google Workspace accounts only
      allowed_domains: lcse.org
      # Auto-create Grafana user on first Google sign-in
      allow_sign_up: true
      role_attribute_path: "contains(['kouni@lcse.org'], email) && 'GrafanaAdmin' || 'Viewer'"
      allow_assign_grafana_admin: true
  # Inject Google OAuth credentials from the grafana-google-oauth Kubernetes Secret.
  # The secret must exist before running helm upgrade:
  #   kubectl apply -f k8s/monitoring/secret-grafana-google-oauth.yaml
  envFromSecret: grafana-google-oauth
  # Admin credentials come from the grafana-admin Secret, created by OpenTofu
  # (random_password.grafana_admin in main.tf). Never set adminPassword here
  # or via --set: the value would end up in shell history and Helm release data.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # The sidecars call Grafana's reload API with the admin password over Basic
  # auth, which is disabled above. Skip the API call: dashboards are picked up
  # by the file provisioner; datasource changes take effect on pod restart.
  # Do not enable initDashboards / initDatasources: the init containers inherit
  # watchMethod WATCH and never exit, blocking the Pod in Init.
  # Grafana is internet-facing, so its ServiceAccount token must not unlock
  # cluster Secrets. Sidecars read ConfigMaps only, from the monitoring
  # namespace only (null clears the kube-prometheus-stack default of ALL).
  sidecar:
    dashboards:
      skipReload: true
      resource: configmap
      searchNamespace: null
    datasources:
      skipReload: true
      resource: configmap
  # The chart's built-in Role/ClusterRole always grants "secrets". Bind the
  # ServiceAccount to the ConfigMap-only Role below instead.
  rbac:
    namespaced: true
    useExistingRole: grafana-sidecar-configmaps
  extraObjects:
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: grafana-sidecar-configmaps
        namespace: monitoring
      rules:
        - apiGroups: [""]
          resources: ["configmaps"]
          verbs: ["get", "watch", "list"]

# ──────────────── Custom Alert Rules ────────────────
# The default KubePodCrashLooping rule only fires on sustained restart loops.
# These rules catch one-off restarts, such as a SIGKILL during a memory burst.
additionalPrometheusRulesMap:
  container-restarts:
    groups:
      - name: container-restarts
        rules:
          - alert: ContainerSigKilled
            # Exit code 137 = SIGKILL: cgroup OOM kill (even when the runtime reports
            # reason=Error instead of OOMKilled) or a liveness-probe kill.
            expr: |
              (kube_pod_container_status_last_terminated_exitcode == 137)
              and on (namespace, pod, container)
              (increase(kube_pod_container_status_restarts_total[15m]) > 0)
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was SIGKILLed"
              description: "Exit code 137 within the last 15 minutes. Check memory working set against the limit and liveness probe results."
          - alert: ContainerRestarted
            expr: increase(kube_pod_container_status_restarts_total[1h]) > 0
            labels:
              severity: info
            annotations:
              summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted"
              description: "{{ $value | humanize }} restart(s) in the last hour. Inspect with: kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c {{ $labels.container }} --previous"

# ──────────────── AlertManager ────────────────
alertmanager:
  alertmanagerSpec:
    replicas: 1

    # 5-day retention for fired alert history
    retention: 120h

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # ARM64 nodes only
    nodeSelector:
      kubernetes.io/arch: arm64

    # NFS-backed alert state; StatefulSet volumeClaimTemplate — retained on helm uninstall
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

# ──────────────── kube-state-metrics ────────────────
kube-state-metrics:
  nodeSelector:
    kubernetes.io/arch: arm64
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ──────────────── node-exporter ────────────────
prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ──────────────── Prometheus Operator ────────────────
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

  nodeSelector:
    kubernetes.io/arch: arm64
